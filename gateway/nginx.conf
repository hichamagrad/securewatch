# ─────────────────────────────────────────────────────────
# API Gateway — Nginx
# PFA 2025-2026 : Point d'entrée unique sécurisé
# HTTP  :8080 → redirige vers HTTPS
# HTTPS :8443 → routes /auth/* et /api/*
# ─────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {

    # ── Zones de rate limiting ───────────────────────────
    # auth_zone : 5 requêtes/minute par IP (protection brute force)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    # api_zone  : 30 requêtes/minute par IP (usage normal API)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;
    # global    : 100 requêtes/minute par IP (protection DDoS global)
    limit_req_zone $binary_remote_addr zone=global_zone:10m rate=100r/m;

    limit_req_status 429;

    # ── Format de log JSON (compatible Filebeat) ─────────
    log_format json_gateway escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"service":"api-gateway",'
            '"level":"INFO",'
            '"ip":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"upstream":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time",'
            '"request_time":"$request_time",'
            '"user_agent":"$http_user_agent",'
            '"event_type":"gateway_request"'
        '}';

    # ── Serveur HTTP : redirige tout vers HTTPS ──────────
    server {
        listen 80;
        server_name localhost securewatch.local;

        access_log /logs/gateway-access.log json_gateway;
        error_log  /var/log/nginx/error.log warn;

        # Stub status accessible en HTTP aussi (pour nginx-exporter interne)
        location /nginx_status {
            stub_status on;
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # Tout le reste → HTTPS
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # ── Serveur HTTPS ────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost securewatch.local;

        # Certificat TLS (auto-signé — remplacer en prod)
        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Logs vers le volume partagé (collecté par Filebeat)
        access_log /logs/gateway-access.log json_gateway;
        error_log  /var/log/nginx/error.log warn;

        # ── En-têtes de sécurité ─────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Gateway "SecureWatch-PFA-2026" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Route AUTH : /auth/* → auth-service:5001 ─────
        location /auth/ {
            limit_req zone=auth_zone burst=10 nodelay;
            limit_req zone=global_zone burst=200 nodelay;

            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass         http://auth-service:5001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Health check API (route interne /health, pas /api/health) ──
        location = /api/health {
            limit_req zone=api_zone burst=50 nodelay;
            limit_req zone=global_zone burst=200 nodelay;

            proxy_pass         http://api-service:5002/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Route API : /api/* → api-service:5002 ────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            limit_req zone=global_zone burst=200 nodelay;

            proxy_pass         http://api-service:5002/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # ── Stub status pour nginx-prometheus-exporter ───
        location /nginx_status {
            stub_status on;
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # ── Réponse 429 personnalisée (rate limit) ────────
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please slow down.","service":"api-gateway"}';
        }

        # ── Blocage de tout le reste ──────────────────────
        location / {
            default_type application/json;
            return 404 '{"error":"Not Found","message":"Route not exposed through gateway","service":"api-gateway"}';
        }
    }
}
