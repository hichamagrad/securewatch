global:
  resolve_timeout: 5m

# ── Routage des alertes ──────────────────────────────────
route:
  group_by: ['alertname', 'category', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'securewatch-null'

  routes:
    # Alertes critiques → receiver dédié (email/Slack à configurer)
    - matchers:
        - severity = "critical"
      receiver: 'securewatch-critical'
      group_wait: 10s
      repeat_interval: 30m

    # Alertes sécurité → receiver dédié
    - matchers:
        - category = "security"
      receiver: 'securewatch-security'
      group_wait: 15s
      repeat_interval: 45m

# ── Inhibition : si un service est DOWN, ignorer ses alertes dérivées ──
inhibit_rules:
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - category = "infrastructure"
    equal: ['job']

# ── Receivers ───────────────────────────────────────────
receivers:

  # Receiver par défaut — alertes visibles dans l'UI Alertmanager uniquement
  - name: 'securewatch-null'

