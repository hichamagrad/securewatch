global:
  resolve_timeout: 5m

# ── Routage des alertes ──────────────────────────────────
route:
  group_by: ['alertname', 'category', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'securewatch-webhook'

  routes:
    - matchers:
        - severity = "critical"
      receiver: 'securewatch-webhook'
      group_wait: 10s
      repeat_interval: 30m

    - matchers:
        - category = "security"
      receiver: 'securewatch-webhook'
      group_wait: 15s
      repeat_interval: 45m

# ── Inhibition ──────────────────────────────────────────
inhibit_rules:
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - category = "infrastructure"
    equal: ['job']

# ── Receivers ───────────────────────────────────────────
receivers:

  # Webhook vers api-service — pipeline complet, aucune config externe requise
  - name: 'securewatch-webhook'
    webhook_configs:
      - url: 'http://api-service:5002/api/alerts/webhook'
        send_resolved: true
        http_config: {}
