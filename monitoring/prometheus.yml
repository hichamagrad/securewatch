global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'securewatch-pfa-2026'

# ── Règles d'alertes ────────────────────────────────────
rule_files:
  - '/etc/prometheus/alert_rules.yml'

# ── Alertmanager ─────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# ── Scrape des métriques ─────────────────────────────────
scrape_configs:

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:5001']
    metrics_path: '/metrics'

  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:5002']
    metrics_path: '/metrics'

  - job_name: 'nginx-gateway'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
