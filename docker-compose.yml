services:

  # ─────────────────────────────────────────
  # ELASTICSEARCH — Stockage & Indexation
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - elk
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────
  # ES SETUP — ILM policy bootstrap (one-shot)
  # Applies securewatch-14d policy to security-logs-* indices
  # ─────────────────────────────────────────
  es-setup:
    image: curlimages/curl:latest
    container_name: es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./elasticsearch/ilm_setup.sh:/ilm_setup.sh:ro
    entrypoint: ["/bin/sh", "/ilm_setup.sh"]
    networks:
      - elk
    restart: "no"

  # ─────────────────────────────────────────
  # KIBANA — Visualisation
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk

  # ─────────────────────────────────────────
  # LOGSTASH — Pipeline de traitement
  # ─────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logs:/logs:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk
    environment:
      - LS_JAVA_OPTS=-Xms128m -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────
  # FILEBEAT — Collecte des logs
  # ─────────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro
    depends_on:
      logstash:
        condition: service_healthy
    networks:
      - elk
    command: filebeat -e --strict.perms=false

  # ─────────────────────────────────────────
  # REDIS — Persistent brute-force counters (~10MB RAM)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks:
      - gateway-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────
  # AUTH SERVICE — Microservice d'authentification
  # (accessible uniquement via la gateway — port 5001 non exposé)
  # ─────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    volumes:
      - ./logs:/app/logs
    environment:
      - SERVICE_NAME=auth-service
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-minimum-32chars!}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-Admin@SecureWatch2026!}
      - DEMO_USER1_PASSWORD=${DEMO_USER1_PASSWORD:-User1@PFA2026!}
      - DEMO_OPERATOR_PASSWORD=${DEMO_OPERATOR_PASSWORD:-Operator@PFA2026!}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - elk
      - gateway-net
      - monitoring-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # API SERVICE — Microservice API principale
  # (accessible uniquement via la gateway — port 5002 non exposé)
  # ─────────────────────────────────────────
  api-service:
    build: ./services/api-service
    container_name: api-service
    volumes:
      - ./logs:/app/logs
    environment:
      - SERVICE_NAME=api-service
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-minimum-32chars!}
    networks:
      - elk
      - gateway-net
      - monitoring-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # API GATEWAY — Nginx (point d'entrée unique)
  # HTTP  :8080 → redirige vers HTTPS :8443
  # HTTPS :8443 → /auth/* et /api/*
  # Rate limiting, logs JSON centralisés dans ELK
  # ─────────────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
      - ./logs:/logs:rw
    depends_on:
      auth-service:
        condition: service_healthy
      api-service:
        condition: service_healthy
    networks:
      - elk
      - gateway-net
      - monitoring-net

  # ─────────────────────────────────────────
  # FRONTEND — Dashboard de monitoring
  # ─────────────────────────────────────────
  frontend:
    build: ./services/frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - elasticsearch
      - gateway
      - grafana
    networks:
      - elk
      - gateway-net
      - monitoring-net

  # ─────────────────────────────────────────
  # PROMETHEUS — Collecte des métriques
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
    depends_on:
      - alertmanager

  # ─────────────────────────────────────────
  # ALERTMANAGER — Gestion et routage des alertes
  # Accessible : http://localhost:9093
  # ─────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - monitoring-net

  # ─────────────────────────────────────────
  # GRAFANA — Dashboards de visualisation
  # Accessible via SecureWatch UI : http://localhost:3000/grafana/
  # Direct : http://localhost:3001  (admin / pfa2026)
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net

  # ─────────────────────────────────────────
  # NODE EXPORTER — Métriques système hôte
  # ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-net

  # ─────────────────────────────────────────
  # NGINX EXPORTER — Métriques Nginx gateway
  # Scrape /nginx_status de la gateway
  # ─────────────────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - '--nginx.scrape-uri=http://gateway/nginx_status'
    depends_on:
      - gateway
    networks:
      - gateway-net
      - monitoring-net

volumes:
  esdata:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  elk:
    driver: bridge
  gateway-net:
    driver: bridge
  monitoring-net:
    driver: bridge
