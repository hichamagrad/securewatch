# ─────────────────────────────────────────
# Pipeline Logstash
# Collecte → Traitement → Elasticsearch
# ─────────────────────────────────────────

input {
  beats {
    port => 5044
  }
}

filter {
  # ── Parsing de la date ──────────────────
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # ── Tags de sécurité (if/else-if — un seul alert_type par événement) ──────────

  # Brute force (priorité maximale)
  if [event_type] == "brute_force" or [message] =~ /[Bb]rute [Ff]orce/ {
    mutate {
      add_tag => ["brute_force", "security_event", "critical"]
      add_field => { "alert_type" => "BRUTE_FORCE" }
    }

  # Échec d'authentification
  } else if [event_type] == "auth_failure" or [message] =~ /[Aa]uthentication failed/ {
    mutate {
      add_tag => ["auth_failure", "security_event"]
      add_field => { "alert_type" => "AUTH_FAILURE" }
    }

  # Accès interdit (403)
  } else if [event_type] == "forbidden_access" or [status] == 403 {
    mutate {
      add_tag => ["forbidden_access", "security_event"]
      add_field => { "alert_type" => "FORBIDDEN" }
    }

  # Accès non autorisé (401) — seulement si pas déjà tagué auth_failure
  } else if [event_type] == "unauthorized_access" or [status] == 401 {
    mutate {
      add_tag => ["unauthorized", "security_event"]
      add_field => { "alert_type" => "UNAUTHORIZED" }
    }

  # Upload suspect
  } else if [event_type] == "suspicious_upload" {
    mutate {
      add_tag => ["suspicious_upload", "security_event"]
      add_field => { "alert_type" => "SUSPICIOUS_UPLOAD" }
    }

  # Rate limit dépassé (429) — depuis la gateway
  } else if [status] == 429 {
    mutate {
      add_tag => ["rate_limited", "security_event"]
      add_field => { "alert_type" => "RATE_LIMITED" }
    }

  # Erreur système (500 / ERROR)
  } else if [level] == "ERROR" or [status] == 500 {
    mutate {
      add_tag => ["server_error"]
      add_field => { "alert_type" => "SERVER_ERROR" }
    }
  }

  # Erreur critique — tag supplémentaire, indépendant de alert_type
  if [level] == "CRITICAL" {
    mutate {
      add_tag => ["critical", "security_event"]
    }
  }

  # Tag source = "gateway" pour les logs Nginx
  if [service] == "api-gateway" {
    mutate {
      add_field => { "source" => "gateway" }
      add_tag   => ["gateway"]
    }
  }

  # ── Nettoyage des champs ──────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "log", "host"]
  }
}

output {
  # Envoi vers Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "security-logs-%{+YYYY.MM.dd}"
  }

  # Debug console (optionnel)
  # stdout { codec => rubydebug }
}
