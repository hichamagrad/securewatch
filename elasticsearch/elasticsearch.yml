# ─────────────────────────────────────────────────────────
# elasticsearch.yml — Configuration Elasticsearch
# PFA 2025-2026 : Sécurité désactivée pour environnement local
# ─────────────────────────────────────────────────────────

# Nœud unique (pas de cluster)
discovery.type: single-node

# Liaison réseau — requis pour que les autres conteneurs Docker puissent joindre ES
network.host: 0.0.0.0

# Désactivation de la sécurité (local uniquement)
xpack.security.enabled: false
xpack.security.http.ssl.enabled: false

# CORS — autoriser le dashboard frontend
http.cors.enabled: true
http.cors.allow-origin: "*"
http.cors.allow-headers: "X-Requested-With,Content-Type,Content-Length,Authorization"
http.cors.allow-methods: "OPTIONS,HEAD,GET,POST,PUT,DELETE"
