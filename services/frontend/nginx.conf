server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options            "DENY"                          always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none';"
        always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Elasticsearch — allowlist only ────────────────────────
    # Allow: GET /_cluster/health  and  POST /security-logs*/_search
    # Deny everything else to prevent data deletion / admin operations.

    location = /es/_cluster/health {
        proxy_pass         http://elasticsearch:9200/_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }

    location ~ "^/es/(security-logs[^/]*)/_search$" {
        limit_except POST OPTIONS {
            deny all;
        }
        rewrite ^/es/(.*)$ /$1 break;
        proxy_pass         http://elasticsearch:9200;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_set_header   Content-Type $content_type;
    }

    # Block all other Elasticsearch endpoints
    location /es/ {
        default_type application/json;
        return 403 '{"error":"Operation not permitted on this Elasticsearch endpoint"}';
    }

    # ── Prometheus — allowlist only ───────────────────────────
    # Allow: GET /api/v1/query  and  GET /api/v1/query_range
    # Deny management endpoints (targets, config, tsdb, admin).

    location ~ "^/prometheus/api/v1/(query|query_range)$" {
        limit_except GET OPTIONS {
            deny all;
        }
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass         http://prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /prometheus/-/healthy {
        proxy_pass         http://prometheus:9090/-/healthy;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Block all other Prometheus endpoints
    location /prometheus/ {
        default_type application/json;
        return 403 '{"error":"Operation not permitted on this Prometheus endpoint"}';
    }

    # ── Service health checks ─────────────────────────────────
    location = /auth-health {
        proxy_pass         http://auth-service:5001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /api-health {
        proxy_pass         http://api-service:5002/health;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /kibana-health {
        proxy_pass         http://kibana:5601/api/status;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /logstash-health {
        proxy_pass         http://logstash:9600/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /gateway-health {
        proxy_pass         http://gateway/nginx_status;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /grafana-health {
        proxy_pass         http://grafana:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /node-exporter-health {
        proxy_pass         http://node-exporter:9100/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /nginx-exporter-health {
        proxy_pass         http://nginx-exporter:9113/metrics;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Grafana — embedded dashboards ─────────────────────────
    location /grafana/ {
        proxy_pass         http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
