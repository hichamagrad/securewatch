server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers Elasticsearch (évite les problèmes CORS)
    location /es/ {
        proxy_pass http://elasticsearch:9200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization';
    }

    # Proxy vers Auth Service — vérification de santé
    location /auth-health {
        proxy_pass http://auth-service:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy vers API Service — vérification de santé
    location /api-health {
        proxy_pass http://api-service:5002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy vers Prometheus — métriques temps réel
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Content-Type';
    }

    # Health checks — un endpoint par service (évite les CORS)
    location /kibana-health {
        proxy_pass http://kibana:5601/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /logstash-health {
        proxy_pass http://logstash:9600/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /gateway-health {
        proxy_pass http://gateway/nginx_status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /grafana-health {
        proxy_pass http://grafana:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /node-exporter-health {
        proxy_pass http://node-exporter:9100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /nginx-exporter-health {
        proxy_pass http://nginx-exporter:9113/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy vers Grafana — dashboards embarqués dans SecureWatch
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket — nécessaire pour les mises à jour live Grafana
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
