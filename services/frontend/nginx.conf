server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options            "DENY"                          always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none';"
        always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────
    # AUTH SERVICE — login + token validation
    # ─────────────────────────────────────────────────────────

    # Public login endpoint (no auth required)
    location = /auth/login {
        proxy_pass         http://auth-service:5001/login;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_set_header   Content-Type $content_type;
    }

    # SSE stream — real-time security events (buffering disabled)
    location = /auth/stream {
        proxy_pass              http://auth-service:5001/events/stream;
        proxy_http_version      1.1;
        proxy_set_header        Host         $host;
        proxy_set_header        X-Real-IP    $remote_addr;
        proxy_set_header        Connection   '';
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        chunked_transfer_encoding on;
    }

    # Internal subrequest for nginx auth_request validation
    location = /auth-validate {
        internal;
        proxy_pass              http://auth-service:5001/validate;
        proxy_http_version      1.1;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length  "";
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        Authorization   $http_authorization;
    }

    # Shared 401 response for protected locations
    location @unauthorized {
        default_type application/json;
        add_header   Content-Type application/json always;
        return 401 '{"error":"Authentication required — please login"}';
    }

    # ─────────────────────────────────────────────────────────
    # ELASTICSEARCH — allowlist + JWT protection
    # ─────────────────────────────────────────────────────────

    location = /es/_cluster/health {
        auth_request      /auth-validate;
        error_page 401  = @unauthorized;
        proxy_pass         http://elasticsearch:9200/_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location ~ "^/es/(security-logs[^/]*)/_search$" {
        auth_request      /auth-validate;
        error_page 401  = @unauthorized;
        limit_except POST OPTIONS { deny all; }
        rewrite ^/es/(.*)$ /$1 break;
        proxy_pass         http://elasticsearch:9200;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_set_header   Content-Type $content_type;
    }

    # Block all other Elasticsearch endpoints
    location /es/ {
        default_type application/json;
        return 403 '{"error":"Operation not permitted on this Elasticsearch endpoint"}';
    }

    # ─────────────────────────────────────────────────────────
    # API SERVICE — pushed alerts (JWT required on the route itself)
    # ─────────────────────────────────────────────────────────

    location = /api/alerts/pushed {
        proxy_pass         http://api-service:5002/api/alerts/pushed;
        proxy_http_version 1.1;
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_set_header   Authorization $http_authorization;
    }

    # ─────────────────────────────────────────────────────────
    # PROMETHEUS — allowlist only
    # ─────────────────────────────────────────────────────────

    location ~ "^/prometheus/api/v1/(query|query_range)$" {
        limit_except GET OPTIONS { deny all; }
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass         http://prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /prometheus/-/healthy {
        proxy_pass         http://prometheus:9090/-/healthy;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /prometheus/ {
        default_type application/json;
        return 403 '{"error":"Operation not permitted on this Prometheus endpoint"}';
    }

    # ─────────────────────────────────────────────────────────
    # SERVICE HEALTH CHECKS
    # ─────────────────────────────────────────────────────────

    location = /auth-health {
        proxy_pass         http://auth-service:5001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /api-health {
        proxy_pass         http://api-service:5002/health;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location = /kibana-health      { proxy_pass http://kibana:5601/api/status;   proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /logstash-health    { proxy_pass http://logstash:9600/;           proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /gateway-health     { proxy_pass http://gateway/nginx_status;     proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /grafana-health     { proxy_pass http://grafana:3000/api/health;  proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /node-exporter-health  { proxy_pass http://node-exporter:9100/;  proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /nginx-exporter-health { proxy_pass http://nginx-exporter:9113/metrics; proxy_http_version 1.1; proxy_set_header Host $host; }

    # ─────────────────────────────────────────────────────────
    # GRAFANA — embedded dashboards
    # ─────────────────────────────────────────────────────────

    location /grafana/ {
        proxy_pass         http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
